<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>搜尋結果｜Moodluma</title>
  <link rel="stylesheet" href="results.css">
  <link rel="icon" type="image/png" href="moodluma-icon.png">
</head>

<body>
  <main class="results-page">
    <header class="results-header">
      <h1>搜尋結果</h1>

      <div class="search-bar">
        <input id="resultSearchInput" type="text" placeholder="例如：想看好笑的、愛情但不要悲劇" aria-describedby="resultSearchSummary" maxlength="240">
        <button id="resultSearchBtn">搜尋</button>
      </div>

      <p id="keywordText"></p>
      <p id="resultSearchSummary" class="search-intent-summary" role="status" aria-live="polite"></p>
      <p id="resultCount" aria-live="polite"></p>
    </header>

    <section id="resultsList" class="results-grid"></section>
  </main>

  <script src="search-rules.js?v=search-20261025"></script>
  <script src="search-engine.js?v=search-20261025"></script>
  <script src="results.js?v=search-20261025"></script>
</body>
</html>
