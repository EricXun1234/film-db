<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>搜尋結果｜Moodluma</title>
  <link rel="stylesheet" href="results.css">
  <link rel="icon" type="image/png" href="moodluma-icon.png">
</head>

<body>
  <main class="results-page">
    <header class="results-header">
      <h1>搜尋結果</h1>

      <div class="search-bar">
        <input id="resultSearchInput" type="text" placeholder="輸入關鍵字，例如：奇幻、戀愛、恐怖">
        <button id="resultSearchBtn">搜尋</button>
      </div>

      <p id="keywordText"></p>
    </header>

    <section id="resultsList" class="results-grid"></section>
  </main>

  <script src="results.js"></script>
</body>
</html>
