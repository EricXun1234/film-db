<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 電影推薦系統</title>
  <link rel="stylesheet" href="home.css" />
</head>

<body>
  <header class="navbar">
    <div class="brand">CineMood</div>
    <nav class="nav-links">
      <a href="#">首頁</a>
      <a href="#trending">熱門</a>
      <a href="#genres">類型</a>
      <a href="#recommended">推薦</a>
    </nav>
    <button class="profile-btn">WH</button>
  </header>

  <main>
    <section class="hero">
      <div class="hero-overlay"></div>
      <div class="hero-content">
        <p class="eyebrow">AI Trailer Recommendation</p>
        <h1>用感覺找電影</h1>
        <p class="hero-text">
          輸入情緒、場景或類型，系統會依照你的關鍵字推薦相似風格的預告片。
        </p>

        <div class="search-area">
          <input
            type="text"
            id="search"
            placeholder="例如：恐怖、感人、校園、犯罪、科幻、療癒"
          />
          <button class="search-btn" onclick="goSearch()">搜尋</button>
        </div>

        <div class="quick-tags"></div>

      </div>
    </section>

    <section class="movie-section" id="trending">
      <div class="section-title">
        <h2>今日熱門</h2>
        <span>Trending Now</span>
      </div>

      <div class="movie-row" id="trendingMovies"></div>
    </section>

    <section class="movie-section" id="recommended">
  <div class="section-title">
    <h2>依照你的喜好推薦</h2>
    <span>Because you searched movies</span>
  </div>

  <div class="movie-row compact" id="dbRecommend"></div>
</section>
  </main>


  <div class="movie-modal" id="movieModal" aria-hidden="true">
    <div class="modal-backdrop" onclick="closeMovieModal()"></div>
    <div class="modal-panel">
      <button class="modal-close" onclick="closeMovieModal()" aria-label="關閉">×</button>
      <div class="modal-poster" id="modalPoster"></div>
      <div class="modal-content">
        <p class="modal-label">Movie Preview</p>
        <h2 id="modalTitle">電影名稱</h2>
        <div class="modal-meta">
          <span id="modalRating">98% Match</span>
          <span id="modalYear">2026</span>
          <span id="modalDuration">1 小時 58 分</span>
          <span id="modalGenre">科幻</span>
        </div>
        <p id="modalDesc">電影簡介</p>
        <div class="modal-actions">
          <button class="play-btn">▶ 播放預告</button>
          <button class="detail-btn">＋ 加入片單</button>
        </div>
      </div>
    </div>
  </div>


  <script src="home.js"></script>
</body>

</html>
