<!DOCTYPE html>
<html lang="zh-Hant"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer"><meta name="robots" content="noindex,nofollow">
<title>設定新密碼｜Moodluma</title>
<link rel="icon" href="moodluma-icon.png"><link rel="stylesheet" href="reset-password.css">
<script src="member-config.js?v=member-20261025" defer></script>
<script src="member-api.js?v=member-20261025" defer></script>
<script src="reset-password.js?v=member-20261025" defer></script>
</head><body><main class="reset-card">
<a class="brand" href="index.html">Moodluma</a><p class="eyebrow">PASSWORD RESET</p>
<h1>設定新密碼</h1><p class="description">輸入新密碼並再次確認，完成後即可返回首頁登入。</p>
<form id="resetPasswordForm">
<label for="newPassword">新密碼</label><input id="newPassword" name="newPassword" type="password" autocomplete="new-password" minlength="6" required placeholder="至少 6 個字元">
<label for="confirmPassword">確認新密碼</label><input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" minlength="6" required placeholder="再次輸入新密碼">
<button id="savePassword" type="submit">設定新密碼</button>
<p id="resetResult" class="reset-message" role="status" aria-live="polite"></p>
</form><a class="back" href="index.html">返回首頁／重新申請</a>
</main></body></html>
